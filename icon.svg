<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: dark cinematic -->
  <rect width="512" height="512" rx="96" fill="#0b0e14"/>
  <rect x="56" y="56" width="400" height="400" rx="72" fill="#151a26"/>

  <!-- Gold accent ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f5b942" stroke-width="18"/>

  <!-- Film strip - Kenney inspired -->
  <g fill="#f5b942">
    <!-- Main film strip body -->
    <rect x="116" y="168" width="280" height="176" rx="16" fill="#1a1204"/>
    <rect x="116" y="168" width="280" height="176" rx="16" fill="none" stroke="#f5b942" stroke-width="6"/>

    <!-- Sprocket holes (left) -->
    <circle cx="138" cy="212" r="14" fill="#0b0e14"/>
    <circle cx="138" cy="212" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>
    <circle cx="138" cy="256" r="14" fill="#0b0e14"/>
    <circle cx="138" cy="256" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>
    <circle cx="138" cy="300" r="14" fill="#0b0e14"/>
    <circle cx="138" cy="300" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>

    <!-- Sprocket holes (right) -->
    <circle cx="374" cy="212" r="14" fill="#0b0e14"/>
    <circle cx="374" cy="212" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>
    <circle cx="374" cy="256" r="14" fill="#0b0e14"/>
    <circle cx="374" cy="256" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>
    <circle cx="374" cy="300" r="14" fill="#0b0e14"/>
    <circle cx="374" cy="300" r="14" fill="none" stroke="#f5b942" stroke-width="3"/>

    <!-- Center film frame indicator -->
    <rect x="216" y="220" width="80" height="45" rx="4" fill="none" stroke="#ffd479" stroke-width="3" stroke-dasharray="8 4"/>
    <rect x="216" y="271" width="80" height="45" rx="4" fill="none" stroke="#ffd479" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Play triangle in center frame (play button style) -->
    <polygon points="240,242.5 240,267.5 270,255" fill="#f5b942"/>
  </g>

  <!-- "BOW" text at bottom -->
  <text x="256" y="380" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="900" text-anchor="middle" fill="#e8ecf4" letter-spacing="0.08em">BOW</text>

  <!-- Subtle gold shimmer line -->
  <line x1="180" y1="395" x2="332" y2="395" stroke="#f5b942" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>