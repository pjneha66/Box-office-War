<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#e8c56d"/>
      <stop offset="100%" stop-color="#f0d48a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#e8c56d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect x="48" y="48" width="416" height="416" rx="72" fill="#0e1218"/>

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="10" filter="url(#glow)" opacity="0.9"/>

  <!-- Inner dark ring -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="#1a1f2a" stroke-width="4"/>

  <!-- Film strip center -->
  <g transform="translate(256, 256)">
    <!-- Film strip body -->
    <rect x="-120" y="-90" width="240" height="180" rx="16" fill="#080b10" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Sprocket holes left -->
    <g fill="#05070a">
      <circle cx="-100" cy="-50" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="-100" cy="0" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="-100" cy="50" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>

    <!-- Sprocket holes right -->
    <g fill="#05070a">
      <circle cx="100" cy="-50" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="100" cy="0" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
      <circle cx="100" cy="50" r="14" stroke="url(#goldGrad)" stroke-width="2"/>
    </g>

    <!-- Center frame indicators -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-dasharray="12 6" opacity="0.6">
      <rect x="-40" y="-60" width="80" height="36" rx="4"/>
      <rect x="-40" y="24" width="80" height="36" rx="4"/>
    </g>

    <!-- Live indicator dot (top right of film) -->
    <circle cx="90" cy="-70" r="10" fill="var(--live-red)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="-66" text-anchor="middle" font-family="Space Grotesk,Inter,sans-serif" font-size="10" font-weight="700" fill="#fff" font-variant-caps="all-small-caps">LIVE</text>

    <!-- "BOW" wordmark -->
    <text x="0" y="135" text-anchor="middle" font-family="Space Grotesk,Inter,sans-serif" font-size="56" font-weight="700" fill="#f0f2f5" letter-spacing="6" filter="url(#innerGlow)">BOW</text>

    <!-- Subtle tagline -->
    <text x="0" y="162" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="500" fill="#8b95a3" letter-spacing="4" text-transform="uppercase">STUDIO EMPIRE</text>
  </g>
</svg>