[package]
name = "box_office_core"
version = "1.0.0"
edition = "2021"
authors = ["Hermes <poshstudio@local>"]
description = "High-performance Rust 2D studio lot simulation engine and isometric pathfinder for Box Office War"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
