<div id="app">
  <header id="topbar" hidden>
    <div class="brand" id="hudStudio">Studio</div>
    <div class="hud">
      <span class="chip chip-cash" id="hudCash">$0</span>
      <span class="chip" id="hudRep" title="Reputation">★ 0</span>
      <span class="chip" id="hudWeek">Y1·W1</span>
    </div>
    <button class="gear" id="btnGear" data-action="gear" aria-label="Settings and save slots" title="Settings &amp; save slots"><svg><use href="#i-gear"/></svg></button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav id="tabbar" hidden>
    <button class="tab" data-action="nav" data-view="studio" aria-label="Studio"><svg><use href="#i-home"/></svg><span>Studio</span></button>
    <button class="tab" data-action="nav" data-view="develop" aria-label="Develop"><svg><use href="#i-clap"/></svg><span>Develop</span></button>
    <button class="weekBtn" id="btnWeek" aria-label="Advance one week"><svg><use href="#i-play"/></svg><span>Week</span></button>
    <button class="tab" data-action="nav" data-view="playing" aria-label="Playing"><svg><use href="#i-ticket"/></svg><span>Playing</span></button>
    <button class="tab" data-action="nav" data-view="ledger" aria-label="Business"><svg><use href="#i-coin"/></svg><span>Business</span></button>
  </nav>

  <div id="sheetWrap" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
  </div>
  <div id="toast" hidden></div>
</div>

<script>
  /* PWA: offline cache — stripped from the APK bundle by apk/build-www.js */
  if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__deferredPrompt = e; });
</script>
