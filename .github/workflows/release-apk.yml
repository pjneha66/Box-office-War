name: Release APK

# Builds the signed Capacitor APK from main and publishes it as a GitHub
# release (tag v<version>, asset BoxOfficeWar-<version>.apk).
#
# Two ways to run:
#   1. Manually: Actions -> Release APK -> Run workflow (version defaults to
#      the version currently checked into main).
#   2. Push a v* tag (e.g. git tag v44.0 && git push origin v44.0).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 44.0 (must match the version checked into main)"
        required: false
        default: "44.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for release notes

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Capacitor 8 CLI requires Node >= 22

      # ubuntu-latest ships the Android SDK already. setup-android@v3 is not
      # used here: it tries to install the removed legacy `tools` package and
      # fails on current cmdline-tools releases.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | head -n1)
          SDKMANAGER="${SDKMANAGER:-$(command -v sdkmanager || true)}"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found under $ANDROID_HOME"; exit 1; }
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install APK build dependencies
        working-directory: apk
        run: npm ci

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version: '$VERSION'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Verify checked-in version matches
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER=$(grep -o 'versionName "[0-9.]*"' apk/android/app/build.gradle | grep -o '[0-9.]*')
          JSON_VER=$(grep -o '"v": "[0-9.]*"' version.json | grep -o '[0-9.]*')
          META_VER=$(grep -o 'name="app-version" content="[0-9.]*"' index.html | grep -o '[0-9.]*')
          echo "build.gradle=$GRADLE_VER version.json=$JSON_VER index.html=$META_VER requested=$VERSION"
          for v in "$GRADLE_VER" "$JSON_VER" "$META_VER"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::Version mismatch: expected $VERSION, found $v. Bump the version files first."; exit 1
            fi
          done

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed, save-preserving APK."
            exit 1
          fi
          mkdir -p apk/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apk/signing/boxofficewar.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "../../signing/boxofficewar.keystore" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > apk/android/keystore.properties
          chmod 600 apk/signing/boxofficewar.keystore apk/android/keystore.properties
          echo "keystore staged ($(stat -c%s apk/signing/boxofficewar.keystore) bytes)"

      - name: Build web bundle
        # Packages the root app, which is the portrait-first build. The flag is
        # retained because the verify step below refers to it, but build-www.js
        # no longer selects a second source tree — game/ was retired in Phase 6.
        run: node apk/build-www.js --rebuild

      - name: Verify the bundle is the portrait app
        shell: bash
        run: |
          set -euo pipefail
          IDX=apk/www/index.html
          [ -f "$IDX" ] || { echo "::error::apk/www/index.html missing"; exit 1; }

          # The portrait shell is the point of this bundle. If the shell or its
          # layout flag is missing, this is the old landscape app and must not
          # be released.
          for f in system/vertical.css system/tokens.css system/components.css; do
            if ! grep -q "$f" "$IDX"; then
              echo "::error::bundle is missing $f — not the portrait build"; exit 1
            fi
          done
          # Match the setAttribute call, not the bare word: `data-layout` also
          # appears in a <head> comment and in every vertical.css selector, so a
          # substring grep would pass on prose with the flag never being set.
          if ! grep -qE "setAttribute\([\"']data-layout[\"']" "$IDX"; then
            echo "::error::bundle never sets data-layout — the vertical shell cannot activate"; exit 1
          fi
          [ -f apk/www/system/vertical.css ] || { echo "::error::system/vertical.css was not copied into the bundle"; exit 1; }

          # The retired game/ tree must not leak back in. mobile-shell.js and
          # phone-ux.js were loaded only by game/, so either one means the old
          # tree got packaged.
          if grep -qE 'mobile-shell\.js|phone-ux\.js' "$IDX"; then
            echo "::error::bundle contains the retired game/ tree (mobile-shell.js/phone-ux.js)"; exit 1
          fi

          # Every asset the shipped index.html names must exist in the bundle.
          # This is the check that would have caught the missing pitch-board.css
          # and cast-catalog.js before they reached a release.
          missing=0
          while IFS= read -r ref; do
            case "$ref" in http*|data:*|//*|"#"*) continue;; esac
            clean="${ref%%\?*}"
            [ -z "$clean" ] && continue
            if [ ! -e "apk/www/$clean" ]; then
              echo "::error::referenced asset missing from bundle: $clean"
              missing=$((missing+1))
            fi
          done < <(grep -oE '(href|src)="[^"]+"' "$IDX" | sed -E 's/^(href|src)="//; s/"$//')
          [ "$missing" -eq 0 ] || { echo "::error::$missing referenced asset(s) missing"; exit 1; }

          echo "bundle verified as the portrait app ($(grep -c '<script src=' "$IDX") scripts)"

      - name: Sync Capacitor web assets
        working-directory: apk
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build signed release APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and stage APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SRC=apk/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || { echo "::error::APK not found at $SRC"; exit 1; }
          APK_META=$(unzip -p "$SRC" assets/public/index.html | grep -o 'name="app-version" content="[0-9.]*"' || true)
          echo "Bundled meta: $APK_META"
          if [ "$APK_META" != "name=\"app-version\" content=\"$VERSION\"" ]; then
            echo "::error::APK content check failed: stale web assets (expected $VERSION)"; exit 1
          fi
          mkdir -p apk/dist
          cp "$SRC" "apk/dist/BoxOfficeWar-$VERSION.apk"
          ls -lh "apk/dist/BoxOfficeWar-$VERSION.apk"

      - name: Publish GitHub release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v "^v$VERSION$" | head -n1 || true)
          {
            echo "Box Office War v$VERSION"
            echo
            echo "Android: download the APK below — fully offline, installs over previous versions without losing saves."
            echo
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              git log --oneline "$PREV..HEAD" --no-decorate | sed 's/^/- /'
            else
              echo "Initial APK release."
            fi
          } > "$NOTES"
          gh release create "v$VERSION" "apk/dist/BoxOfficeWar-$VERSION.apk" \
            --title "v$VERSION — Android APK (fully offline)" \
            --notes-file "$NOTES"
          echo "Released: https://github.com/pjneha66/Box-office-War/releases/tag/v$VERSION"
